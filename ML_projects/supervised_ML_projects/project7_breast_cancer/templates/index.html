<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Breast Cancer Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.container{
max-width:900px;
}

.card{
border-radius:18px;
}

h2{
font-weight:bold;
color:#0d6efd;
}

label{
font-weight:600;
}

.result{
font-size:28px;
font-weight:bold;
}

.nav-tabs .nav-link{
font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
🩺 Breast Cancer Prediction
</h2>

<form action="/predict" method="POST">

<ul class="nav nav-tabs">

<li class="nav-item">
<button class="nav-link active"
type="button"
data-bs-toggle="tab"
data-bs-target="#mean">
Mean Features
</button>
</li>

<li class="nav-item">
<button class="nav-link"
type="button"
data-bs-toggle="tab"
data-bs-target="#error">
Error Feature
</button>
</li>

<li class="nav-item">
<button class="nav-link"
type="button"
data-bs-toggle="tab"
data-bs-target="#worst">
Worst Features
</button>
</li>

</ul>

<div class="tab-content mt-4">

<!-- ========================= -->
<!-- Mean Features -->
<!-- ========================= -->

<div class="tab-pane fade show active" id="mean">

<div class="row">

<div class="col-md-6 mb-3">
<label>Mean Radius</label>
<input type="number" step="any" class="form-control" name="f1" required>
</div>

<div class="col-md-6 mb-3">
<label>Mean Texture</label>
<input type="number" step="any" class="form-control" name="f2" required>
</div>

<div class="col-md-6 mb-3">
<label>Mean Area</label>
<input type="number" step="any" class="form-control" name="f3" required>
</div>

<div class="col-md-6 mb-3">
<label>Mean Compactness</label>
<input type="number" step="any" class="form-control" name="f4" required>
</div>

<div class="col-md-6 mb-3">
<label>Mean Concavity</label>
<input type="number" step="any" class="form-control" name="f5" required>
</div>

<div class="col-md-6 mb-3">
<label>Mean Concave Points</label>
<input type="number" step="any" class="form-control" name="f6" required>
</div>

</div>

</div>

<!-- ========================= -->
<!-- Error Feature -->
<!-- ========================= -->

<div class="tab-pane fade" id="error">

<div class="row">

<div class="col-md-6 mb-3">

<label>Area Error</label>

<input
type="number"
step="any"
class="form-control"
name="f7"
required>

</div>

</div>

</div>

<!-- ========================= -->
<!-- Worst Features -->
<!-- Continue in Part 2 -->
<!-- ========================= -->

<div class="tab-pane fade" id="worst">

<div class="row">
<div class="col-md-6 mb-3">
<label>Worst Radius</label>
<input type="number" step="any" class="form-control" name="f8" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Texture</label>
<input type="number" step="any" class="form-control" name="f9" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Perimeter</label>
<input type="number" step="any" class="form-control" name="f10" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Area</label>
<input type="number" step="any" class="form-control" name="f11" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Smoothness</label>
<input type="number" step="any" class="form-control" name="f12" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Concavity</label>
<input type="number" step="any" class="form-control" name="f13" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Concave Points</label>
<input type="number" step="any" class="form-control" name="f14" required>
</div>

<div class="col-md-6 mb-3">
<label>Worst Fractal Dimension</label>
<input type="number" step="any" class="form-control" name="f15" required>
</div>

</div>

</div>

</div>

<hr>

<div class="text-center mt-4">

<button
type="button"
class="btn btn-success me-2"
onclick="loadBenign()">
Load Benign Sample
</button>

<button
type="button"
class="btn btn-danger me-2"
onclick="loadMalignant()">
Load Malignant Sample
</button>

<button
type="submit"
class="btn btn-primary">
Predict
</button>

</div>

</form>

{% if prediction_text %}

<div class="alert alert-info mt-4 text-center">

<h4>Prediction Result</h4>

<h2 class="result">

{{ prediction_text }}

</h2>

</div>

{% endif %}

</div>

</div>

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
